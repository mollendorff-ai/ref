name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/**'
  schedule:
    # Weekly, so new advisories against the dependencies show up even without commits
    - cron: '17 6 * * 1'

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Pinned so a new Rust release cannot turn main red without a code change.
      # Bump it on purpose (and fix any new lints) when upgrading.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (pedantic, all targets)
        run: cargo clippy --all-targets -- -D warnings -W clippy::pedantic

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      # Fails on known vulnerabilities; "unmaintained" notices are warnings
      - name: cargo audit
        run: cargo audit

  test:
    name: Unit tests (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}

      # Tests that need Chrome run in plain cargo test (ADR-004)
      - name: Verify Chrome
        run: google-chrome-stable --version

      - name: Run tests
        run: cargo test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    outputs:
      percentage: ${{ steps.coverage.outputs.percentage }}
      total: ${{ steps.tests.outputs.total }}
      ignored: ${{ steps.tests.outputs.ignored }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        id: toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # The Rust version is in the key: test binaries cached by another version
      # would be counted as never-run copies of the code (Rust 1.100 changed
      # Cargo's build folder layout, so old ones are not cleaned up)
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-cov-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Run coverage (all code, 100% gate)
        id: coverage
        run: |
          # Every line of every file (ADR-004): no exclusions
          STATUS=0
          OUTPUT=$(cargo llvm-cov --fail-under-lines 100 2>&1) || STATUS=$?
          echo "$OUTPUT"

          # Extract line coverage percentage
          COVERAGE=$(echo "$OUTPUT" | grep '^TOTAL' | awk '{print $10}' | tr -d '%')
          echo "percentage=$COVERAGE" >> "$GITHUB_OUTPUT"
          echo "Coverage: ${COVERAGE}%"
          exit $STATUS

      - name: Count tests
        id: tests
        run: |
          OUTPUT=$(cargo test 2>&1)
          echo "$OUTPUT" | tail -20

          # Sum test counts from all test binaries
          TOTAL=$(echo "$OUTPUT" | grep '^test result:' | awk '{sum += $4} END {print sum}')
          IGNORED=$(echo "$OUTPUT" | grep '^test result:' | awk '{sum += $10} END {print sum}')
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "ignored=$IGNORED" >> "$GITHUB_OUTPUT"
          echo "Tests: $TOTAL passed, $IGNORED ignored"

  badges:
    name: Update badges
    runs-on: ubuntu-latest
    needs: [lint, test, coverage]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Update test count badge
        uses: schneegans/dynamic-badges-action@v1.8.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.BADGE_GIST_ID }}
          filename: ref-tests.json
          label: tests
          message: "${{ needs.coverage.outputs.total }} passing"
          color: brightgreen

      - name: Update coverage badge
        uses: schneegans/dynamic-badges-action@v1.8.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.BADGE_GIST_ID }}
          filename: ref-coverage.json
          label: coverage
          message: "${{ needs.coverage.outputs.percentage }}%"
          valColorRange: ${{ needs.coverage.outputs.percentage }}
          minColorRange: 50
          maxColorRange: 100

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release

  auto-release:
    name: Auto Release
    runs-on: ubuntu-latest
    needs: [lint, audit, test, coverage, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check version change
        id: version
        run: |
          CURRENT=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "current=$CURRENT" >> $GITHUB_OUTPUT

          git show HEAD~1:Cargo.toml > /tmp/old_cargo.toml 2>/dev/null || echo 'version = "0.0.0"' > /tmp/old_cargo.toml
          OLD=$(grep '^version = ' /tmp/old_cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')

          if [ "$CURRENT" != "$OLD" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Version changed: $OLD -> $CURRENT"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Version unchanged: $CURRENT"
          fi

      - name: Create release tag
        if: steps.version.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.current }}" -m "Release v${{ steps.version.outputs.current }}"
          git push origin "v${{ steps.version.outputs.current }}"

      # Tags pushed with GITHUB_TOKEN do not start other workflows, so start
      # the release build explicitly on the new tag.
      - name: Start release workflow
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref "v${{ steps.version.outputs.current }}"
