[package]
name = "mollendorff-ref"
version = "1.8.2"
edition = "2021"
authors = ["Möllendorff AI <admin@mollendorff.ai>"]
description = "Renders web pages and PDFs into compact JSON for LLM agents"
license = "MIT"
repository = "https://github.com/mollendorff-ai/ref"
keywords = ["cli", "web", "scraper", "headless", "chrome"]
categories = ["command-line-utilities", "web-programming"]
readme = "README.md"

[[bin]]
name = "ref"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-std", "signal", "sync", "time"] }
futures = "0.3"

# Headless Chrome (CDP)
chromiumoxide = "0.9"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# HTML parsing
scraper = "0.27"
ego-tree = "0.11"

# Regex for URL extraction
regex = "1.12"

# File globbing
glob = "0.3"

# PDF extraction
pdf-extract = "0.12"

# Error handling
anyhow = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# URL parsing
url = "2.5"
sha2 = "0.10"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }

# MCP server (Model Context Protocol)
rmcp = { version = "3.9", features = ["server", "transport-io", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2.1"
predicates = "3.1"
tempfile = "3.25"
wiremock = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# Unwind (not abort) so a panic in a PDF parser becomes an error, and Chrome
# and its temporary profile are cleaned up on the way out.
