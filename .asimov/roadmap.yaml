# Möllendorff Asimov Roadmap
#
# WHAT to build - milestones only
#
# See: CHANGELOG.md for release history
# See: docs/adr/ for detailed rationale
#
# Sprint execution: each upcoming item runs as a named team (3 agents).
# Agent types: general-purpose (full file read/write/bash access).
# Spin up with: TeamCreate team_name, then Agent tool with team_name + name.

