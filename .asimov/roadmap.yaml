      - "Split any file that passes 1,500 lines (on 2026-11-17 the largest are fetch.rs, 1,353, and browser/mod.rs, 1,206)"
      - "Done 2026-11-17. Real tests for the clean-up after killed runs (sweep_orphans, kill_chrome_using: plant a profile folder named for a dead ref process) and for navigation timeouts; before, they were covered only by leftovers of earlier runs"
      - "Done 2026-11-17: browser.rs split into browser/mod.rs (pool and lifecycle), page.rs (tabs) and process.rs (starting Chrome, processes, profile folders)"
  - summary: "MCP tools lock each other out of a saved profile (done 2026-11-17, Unreleased)"
    goal: "MCP_SHARED_PROFILE"
    source: "Probe on 2026-11-17: after ref_fetch, ref_check_links on a saved profile fails with 'profile is open in another Chrome'"
    deliverables:
      - "ref_check_links, ref_refresh_data and ref_verify_refs reuse the server's shared browser instead of starting a second Chrome on the same profile"
      - "The lock error names the real holder (here the MCP server's own Chrome), not only ref login"
      - "Test with a saved profile: ref_fetch, then each other browser tool, all succeed"
  - summary: "Chrome lifecycle: implement ADR-005 in one pass (implemented 2026-11-17; fixing the review against the ADR)"
    goal: "CHROME_LIFECYCLE"
    source: "Third review on 2026-11-17 (range 8b9cd7c..18a7b16): ten findings, all in how ref handles a Chrome that crashes or hangs; ADR-005 replaces patching"
    deliverables:
      - "ADR-005 accepted by the maintainer (2026-11-17)"
      - "Rule 1: the pool records its Chrome's process id at start and signals nothing else; remove stop_chrome (kill by lock file)"
      - "Rule 2: is_alive with a 5 s limit"
      - "Rule 3: typed ChromeFailed error, failed pools stay failed, a Chrome failure ends the command (exit 2, MCP tool error); verify-refs never writes after one, also mid-navigation"
      - "Rule 4: stop through &self (browser handle behind a read-write lock): ask, wait 30 s after an acknowledged close, then kill; collect the process; remove close_shared, is_zombie and the unconditional kill after 5 s"
      - "Rule 5: the MCP server replaces a failed Chrome between calls"
      - "Rule 6: one helper and one table of time limits; one 30 s budget for a tab's set-up and one for a page's reads; a tab is closed whichever way set-up ends"
      - "Rule 7: task::isolated cancels its task when the caller stops waiting"
      - "The seven tests in the ADR, with a real Chrome frozen (SIGSTOP) or killed; one kill_process helper"
      - "README, MCP guide and CHANGELOG say what a Chrome failure does"
      - "Done 2026-11-17. Review against ADR-005 (5ac18a2..fe2d1a7, 2026-11-17): drop the message handler before collecting an exited Chrome; never ask whether Chrome is alive while holding the browser lock; keep ChromeFailed typed in verify-refs; stop the shared Chrome gracefully when the MCP server ends; remove the profile when Chrome does not answer at start; a new navigation gets a new read budget; no new #[allow] in mcp.rs; one remove-and-retry helper, waiting only after a kill; stop returns ()"
      - "Done 2026-11-17. Decided 2026-11-17 (ADR-005 rule 3): in verify-refs, a tab that cannot be opened or set up while Chrome answers ends the run and writes nothing; the other commands keep it as that URL's error"
      - "Done 2026-11-17. Last review (fe2d1a7..06650a5), to fix here: new_page checks for a failed pool again after waiting for a tab slot; remove_dir_retrying stops as soon as the folder is gone and retries whenever it is not (a crashed Chrome's helpers may still write), so the final clean-up no longer waits per folder; goto clears the read budget when it starts"
      - "Stopping rule (2026-11-17): after these fixes, one more review; then anything that is not a real bug goes to the roadmap and work moves to STRICT_RULES step 4"
      - "Done 2026-11-21. Final review (06650a5..ec2e81e): one real bug, fixed: cli::main held the standard-input lock for the whole run, so ref mcp never read a request (a regression from moving main into cli, never released); two minor findings moved to CHROME_LIFECYCLE_FOLLOWUP"
  - summary: "Chrome lifecycle: what the last review left (not regressions) (done 2026-11-21)"
    goal: "CHROME_LIFECYCLE_FOLLOWUP"
    source: "Final review on 2026-11-17 (fe2d1a7..06650a5), sorted under the stopping rule: three small regressions are fixed in CHROME_LIFECYCLE, the rest is here"
    deliverables:
      - "Done 2026-11-21. ref mcp ended by a signal (Ctrl-C, SIGTERM) stops its Chrome gracefully, within a limit, instead of killing it; today only a closed input does (main.rs drops the command on a signal)"
      - "Done 2026-11-21. After the server ends, a tool call still running must not start a new Chrome (a 'server ended' state in the pool slot)"
      - "Done 2026-11-17. One guard for start-up failures: every way BrowserPool::new fails (the retry without the sandbox too) ends its Chrome and removes a fresh profile; a Chrome that dies right after launch is an error, not a pool with an empty user agent"
      - "Done 2026-11-21 (Chrome::open_tab; alive and has_tab only ask and judge nothing). One Chrome method for requests on the browser itself (read lock, attempt, drop the lock, then judge, with the failed-pool check), so the lock order cannot be got wrong at a new call site"
      - "Done 2026-11-17. A test that runs run_mcp itself (with STRICT_RULES: mcp in-process), so the graceful stop at its end is covered"
      - "Done 2026-11-21: it found a real bug, a tab closed just before navigation was written as dead (Navigation timeout); now a closed tab is an error naming the tab. verify-refs: a test for a tab that dies between opening and navigation, and an error message that says it was the tab"
      - "Done 2026-11-21 (ADR-006, accepted): process-level tests in src/cli.rs run ref as a child process on real standard input, output, error and SIGTERM (ref mcp end to end, check-links --stdin, exit 130); step 2 done the same day: every real resource in the ADR table has a test of the real wiring (the home folder through a child with its own HOME, update's real addresses); gaps accepted in the ADR: ref login with the real Chrome, a real request to GitHub; a new seam must add a table row"
      - "Done 2026-11-21. Orphan sweep: remove_dir_retrying waits 600 ms on every leftover folder it cannot remove (for example another user's in a shared /tmp), on a tokio worker at every pool start; wait and retry only after a kill (final review, 2026-11-21)"
      - "Done 2026-11-21 (the opening runs on a task that closes a tab nobody waits for; a tab closes on drop during set-up). A tab is not closed when opening it hits its time limit while Chrome answers, or when the call is cancelled during set-up; matters for the long-lived MCP Chrome (final review, 2026-11-21; older than 06650a5)"
