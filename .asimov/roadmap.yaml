upcoming:
  - summary: "Meet the strict quality rules (ADR-004, CLAUDE.md)"
    goal: "STRICT_RULES"
    source: "Measured on 2026-11-16 over all code, every test run: 78.03% line coverage (5,125 lines, 1,126 not covered)"
    deliverables:
      - "Rules written down: CLAUDE.md, .asimov/project.yaml coding_standards, ADR-004 (supersedes ADR-003)"
      - "Done 2026-11-17. Seam 1, output: each run_* command writes its JSON to a writer it is given (main passes stdout), so inline tests read the output in-process; internal only"
      - "Done 2026-11-17. Seam 2, profile: global option ref --profile <folder|fresh>, read from REF_CHROME_PROFILE when not given (clap env), passed to the five places that start Chrome (fetch, check_links, verify_refs, refresh_data, mcp); ref login keeps its own --profile <folder> with the same parsing and refuses fresh; every Chrome test passes --profile fresh, so tests never touch a saved profile and run in parallel; README and CHANGELOG updated; ships in 1.10.0"
      - "main becomes a thin wrapper over cli::run(args) -> ExitCode; tests/cli_tests.rs moves inline and calls it in-process"
      - "tests/e2e_local.rs moves inline into fetch, browser and pdf; no #[ignore], Chrome tests run in plain cargo test"
      - "Cover update, check_links, verify_refs, refresh_data (injected base URL, local server), init and scan (temporary folders), mcp (in-process), login (headless seam)"
      - "Remove the coverage exclusions from the Makefile and CI; gate is cargo llvm-cov --fail-under-lines 100 over everything; README badge renamed from Logic coverage"
      - "Split any file that passes 1,500 lines once its tests are inline (browser.rs and fetch.rs are closest)"
      - "Real tests for the clean-up after killed runs (sweep_orphans, kill_chrome_using: plant a profile folder named for a dead ref process) and for navigation timeouts; on 2026-11-17 they were covered only by leftovers of earlier runs"
      - "Done 2026-11-17: browser.rs split into browser/mod.rs (pool and lifecycle), page.rs (tabs) and process.rs (starting Chrome, processes, profile folders)"
  - summary: "MCP tools lock each other out of a saved profile (done 2026-11-17, Unreleased)"
    goal: "MCP_SHARED_PROFILE"
    source: "Probe on 2026-11-17: after ref_fetch, ref_check_links on a saved profile fails with 'profile is open in another Chrome'"
    deliverables:
      - "ref_check_links, ref_refresh_data and ref_verify_refs reuse the server's shared browser instead of starting a second Chrome on the same profile"
      - "The lock error names the real holder (here the MCP server's own Chrome), not only ref login"
      - "Test with a saved profile: ref_fetch, then each other browser tool, all succeed"
  - summary: "Chrome lifecycle: implement ADR-005 in one pass (done 2026-11-17, Unreleased)"
    goal: "CHROME_LIFECYCLE"
    source: "Third review on 2026-11-17 (range 8b9cd7c..18a7b16): ten findings, all in how ref handles a Chrome that crashes or hangs; ADR-005 replaces patching"
    deliverables:
      - "ADR-005 accepted by the maintainer (2026-11-17)"
      - "Rule 1: the pool records its Chrome's process id at start and signals nothing else; remove stop_chrome (kill by lock file)"
      - "Rule 2: is_alive with a 5 s limit"
      - "Rule 3: typed ChromeFailed error, failed pools stay failed, a Chrome failure ends the command (exit 2, MCP tool error); verify-refs never writes after one, also mid-navigation"
      - "Rule 4: stop through &self (browser handle behind a read-write lock): ask, wait 30 s after an acknowledged close, then kill; collect the process; remove close_shared, is_zombie and the unconditional kill after 5 s"
      - "Rule 5: the MCP server replaces a failed Chrome between calls"
      - "Rule 6: one helper and one table of time limits; one 30 s budget for a tab's set-up and one for a page's reads; a tab is closed whichever way set-up ends"
      - "Rule 7: task::isolated cancels its task when the caller stops waiting"
      - "The seven tests in the ADR, with a real Chrome frozen (SIGSTOP) or killed; one kill_process helper"
      - "README, MCP guide and CHANGELOG say what a Chrome failure does"
  - summary: "Content detection on GitHub pages"
    goal: "GITHUB_CONTENT"
    source: "Live test on 2026-11-16: ref fetch https://github.com/mollendorff-ai/ref"
    deliverables:
      - "No false paywall: a public repo page (13,046 readable chars) comes back as status paywall, likely from GitHub's 'You must be signed in to...' button wording"
      - "Main content: the README (article.markdown-body) should win over repository navigation, About, Stars, Forks and other sidebar sections, which come first and repeat after it"
  - summary: "Evaluation fixes (Ref Evaluation, 2026-11-16, grade A-)"
    goal: "EVAL_FIXES"
    deliverables:
      - "Create the saved-profile folder readable by the owner only (0700); today src/browser.rs creates it with default permissions"
      - "README: say that ref fetch opens localhost and private addresses"
      - "README: one line on sites' terms of service for signed-in browsing"
      - "README: 'ref pdf' does not use the saved profile (URLs are downloaded without Chrome or its cookies); only ref fetch of a PDF URL is signed in. Fix the sentence under First time, step 4, or give ref pdf the profile's cookies"
      - "One description everywhere: README and Cargo.toml say 'compact JSON', the GitHub About says 'token-optimized JSON', mollendorff.ai says 'clean JSON', .asimov/project.yaml has its own"
  - summary: "--user-agent in the MCP server"
    goal: "MCP_USER_AGENT"
    deliverables:
      - "user_agent parameter on ref_fetch and ref_check_links (src/mcp.rs passes None today)"
      - "Try --user-agent against sec.gov (www.sec.gov is allowed in the cloud environment)"
  - summary: "macOS check (manual, on Luis's Mac)"
    goal: "MACOS_CHECK"
    deliverables:
      - "ref update, ref login, sign in to sites, quit Chrome with Cmd-Q, then check that a signed-in page fetches"
      - "After CHROME_LIFECYCLE (ADR-005, untested on macOS): with ref mcp running on the saved profile, kill ref's Chrome and make another call; it should start a new Chrome and succeed"
      - "After CHROME_LIFECYCLE: after such a crash, run ref login, then make an MCP call; the login window must stay open and the call must say the profile is in use"

