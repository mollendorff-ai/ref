identity:
  name: "ref"
  type: rust

description: "CLI for fetching web pages (via headless Chrome) and extracting structured content from PDFs — tables, headings, text. Single static binary, no runtime deps."

stack:
  - "chromiumoxide (headless Chrome)"
  - "lopdf (PDF parsing)"
  - "clap (CLI)"
  - "tokio (async runtime)"
  - "thiserror (error types)"

conventions:
  - "Result<T, E> for errors, no panics"
  - "No unwrap() in library code"
  - "clippy pedantic, zero warnings"
  - "Colocated tests (#[cfg(test)] mod tests)"
  - "One sentence per line in docs (for git diffs)"
