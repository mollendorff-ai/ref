identity:
  name: "ref"
  type: rust

description: "CLI and MCP server for fetching web pages (via headless Chrome) and extracting structured content from PDFs — tables, headings, text. Single static binary; needs Chrome or Chromium installed."

stack:
  - "chromiumoxide (headless Chrome)"
  - "pdf-extract (PDF parsing)"
  - "scraper (HTML parsing)"
  - "rmcp (MCP server)"
  - "clap (CLI)"
  - "tokio (async runtime)"
  - "anyhow (error handling)"

conventions:
  - "Result<T, E> for errors, no panics"
  - "No unwrap() in library code; constant regexes are LazyLock statics with expect(\"constant regex\")"
  - "clippy pedantic, zero warnings"
  - "Colocated tests (#[cfg(test)] mod tests)"
  - "One sentence per line in docs (for git diffs)"

# Non-negotiable. The same rules, with the commands that check them, are in CLAUDE.md and docs/adr/ADR-004-STRICT-QUALITY-RULES.md.
coding_standards:
  - "100% line coverage of all code, nothing skipped: no --ignore-filename-regex, no #[ignore], no #[coverage(off)]; hard-to-test code is made testable, never excluded"
  - "Pedantic linting and formatting, nothing skipped: cargo fmt --check and cargo clippy --all-targets -- -D warnings -W clippy::pedantic; no new #[allow(clippy::...)]"
  - "All tests inline in #[cfg(test)] mod tests in the file they test; no tests/*.rs files (test data may live in tests/fixtures/)"
  - "No source file over 1,500 lines, tests included; split it into a module folder along its real seams first"
  - "Tests that need Chrome run in plain cargo test; Chrome is a requirement of the tool and of its tests"
