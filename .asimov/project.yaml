identity:
  name: "ref"
  type: rust

description: "CLI and MCP server for fetching web pages (via headless Chrome) and extracting structured content from PDFs — tables, headings, text. Single static binary; needs Chrome or Chromium installed."

stack:
  - "chromiumoxide (headless Chrome)"
  - "pdf-extract (PDF parsing)"
  - "scraper (HTML parsing)"
  - "rmcp (MCP server)"
  - "clap (CLI)"
  - "tokio (async runtime)"
  - "anyhow (error handling)"

conventions:
  - "Result<T, E> for errors, no panics"
  - "No unwrap() in library code; constant regexes are LazyLock statics with expect(\"constant regex\")"
  - "clippy pedantic, zero warnings"
  - "Colocated tests (#[cfg(test)] mod tests)"
  - "One sentence per line in docs (for git diffs)"
